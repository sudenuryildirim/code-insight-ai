<div class="layout">
  <section class="panel editor-panel">
    <div class="panel-header">
      <h3>Kaynak Kodu Analiz Alanı</h3>
      <div class="header-actions">
        <input
          #fileInput
          type="file"
          hidden
          (change)="onFileSelected($event)"
        />
        <button type="button" class="btn btn-ghost" (click)="triggerFilePicker()">Dosya Yükle</button>
      </div>
    </div>

    <textarea
      class="code-textarea"
      [value]="code"
      (input)="onCodeInput($event)"
      placeholder="Buraya gözden geçirilmesini istediğiniz kodu yapıştırın veya yukarıdan bir dosya yükleyin.&#10;Programlama dilini seçmenize gerek yok; yapay zeka dosya adına ve kod söz dizimine bakarak bunu kendisi tespit eder."
    ></textarea>
  </section>

  <aside class="panel sidebar-panel">
    <h3>Analiz Ayarları</h3>

    <div class="field">
      <label for="fileNameInput">Dosya Adı</label>
      <input
        id="fileNameInput"
        type="text"
        [value]="fileName"
        (input)="onFileNameInput($event)"
      />
      <p class="hint">Programlama dili otomatik olarak tespit edilir; seçim yapmanız gerekmez.</p>
    </div>

    <ul class="feature-list">
      <li *ngFor="let feature of features">
        <span class="check">✓</span>
        <span>{{ feature }}</span>
      </li>
    </ul>

    <div class="error-box" *ngIf="errorMessage">
      {{ errorMessage }}
    </div>

    <button type="button" class="btn btn-primary btn-block" [disabled]="isLoading" (click)="onAnalyzeClick()">
      <span *ngIf="!isLoading">Kodu İncele</span>
      <span *ngIf="isLoading">Analiz Ediliyor…</span>
    </button>
  </aside>
</div>
