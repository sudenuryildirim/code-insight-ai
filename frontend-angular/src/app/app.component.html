<div class="shell">
  <header class="page-header">
    <div class="page-header-inner">
      <div class="brand">
        <div class="mark">C</div>
        <div class="brand-text">
          <h1>CodeInsightAI<span class="accent-bar"></span></h1>
          <span>GitHub Pull Request İnceleme Aracı</span>
        </div>
      </div>
      <button type="button" class="settings-btn" (click)="openPromptSettings()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
        Talimat Ayarları
      </button>
    </div>
  </header>

  <main class="page-content">
    <div class="page-content-inner">
      <app-pull-request-list></app-pull-request-list>
    </div>
  </main>

  @if (showPromptSettings) {
    <app-prompt-settings (closed)="closePromptSettings()"></app-prompt-settings>
  }

  <footer class="page-footer">
    <div class="page-footer-inner">
      <span>CodeInsightAI</span>
      <span class="footer-note">Onay ve merge kararı her zaman insana aittir — bu sistem yalnızca raporlar.</span>
    </div>
  </footer>
</div>
